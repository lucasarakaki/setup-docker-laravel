services:
    # image project
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: dev_workspace
        restart: unless-stopped
        working_dir: /var/www/
        volumes:
            - ./workspace:/var/www
        ports:
            - 8090:8000
        tty: true
        stdin_open: true
        depends_on:
            - redis
        networks:
            - dev_network

    # db mysql
    db:
        image: mysql:5.7
        container_name: dev_db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-laravel}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
            MYSQL_PASSWORD: ${DB_PASSWORD:-userpass}
            MYSQL_USER: ${DB_USERNAME:-username}
        volumes:
            - dbdata:/var/lib/mysql
        ports:
            - "3306:3306"
        networks:
            - dev_network

    # PHPMyAdmin
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: dev_phpmyadmin
        restart: unless-stopped
        ports:
            - "8070:80"
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-userpass}
        depends_on:
            - db
        networks:
            - dev_network

volumes:
    dbdata:

networks:
    dev_network:
        driver: bridge
